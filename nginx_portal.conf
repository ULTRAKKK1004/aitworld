server {
    listen 80;
    server_name ai-tworld.com www.ai-tworld.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name ai-tworld.com www.ai-tworld.com;

    ssl_certificate /etc/letsencrypt/live/ai-tworld.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-tworld.com/privkey.pem;
    
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 루트 경로 접속 시 /portal/ 로 리다이렉트
    location = / {
        return 301 https://$host/portal/;
    }

    # Frontend (React Build 파일)
    location /portal/ {
        alias /var/www/portal/;
        index index.html;
        try_files $uri $uri/ /portal/index.html;
    }

    # Backend API Proxy
    location /api/ {
        proxy_pass http://localhost:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
