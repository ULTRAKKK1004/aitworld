<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero's Quest DX</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; overflow: hidden; touch-action: none; font-family: Arial, sans-serif; }
        #game-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; }
        #error-log { position: absolute; top: 0; left: 0; color: red; background: rgba(0,0,0,0.8); z-index: 9999; padding: 10px; display: none; white-space: pre-wrap; width: 100%; }
    </style>
    <script>
        window.addEventListener('error', function(e) {
            var log = document.getElementById('error-log');
            if(log) {
                log.style.display = 'block';
                log.innerText += '\n' + e.message + ' at ' + e.filename + ':' + e.lineno;
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <div id="error-log"></div>
    <div id="game-container"></div>
    
    <script src="js/audio.js"></script>
    <script src="js/assets.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
